let TR=TRAILS[4];
function build(tr){
  TR=tr;const R=rng(7+tr.id.length*97+tr.name.charCodeAt(1));deco.length=0;checkpoints.length=0;checkpoints.push(0);
  let y=300;const pts=[];const push=v=>pts.push(v);const S=tr.size,Gd=tr.grade;
  const slope=(len,g)=>{for(let i=0;i<len/STEP;i++){y+=g*STEP;push(y);}};
  const curve=(len,dy,f)=>{const y0=y;for(let i=1;i<=len/STEP;i++){const t=i/(len/STEP);y=y0+dy*f(t);push(y);}};
  const X=()=>pts.length*STEP;
  slope(500,0.05);
  deco.push({t:'sign',x:300});
  tr.feats.forEach((f,i)=>{
    if(i>0&&i%5==0){checkpoints.push(X());deco.push({t:'flag',x:X()});}
    slope(160+R()*120,Gd);
    if(f=='table'||f=='big'){const big=f=='big';const hgt=(big?110:50+R()*30)*S;
      curve(big?200:130,-hgt,t=>t*t);
      slope((big?300:130+R()*60)*Math.max(0.6,S),0);curve(big?280:200,hgt+70,t=>(1-Math.cos(Math.PI*t))/2);if(big)deco.push({t:'label',x:X()-500,s:'THE 40-FOOTER'});}
    else if(f=='step'){curve(110,-40*S,t=>t*t);curve(60,140*S,t=>t*t);slope(160,0.4);}
    else if(f=='stepup'){curve(120,-60,t=>t*t);curve(50,40,t=>t);curve(30,-70,t=>t);slope(160,0);curve(160,60,t=>(1-Math.cos(Math.PI*t))/2);deco.push({t:'label',x:X()-300,s:'STEP-UP'});}
    else if(f=='drop'){slope(120,0.02);curve(16,110*S,t=>t);slope(220,0.45);}
    else if(f=='rocks'||f=='roots'){const r=f=='roots';const x0=X();for(let k=0;k<300/STEP;k++){y+=(Gd*0.7)*STEP;push(y+Math.sin(k*(r?1.6:0.9))*(r?3:4)+(R()-.5)*(r?3:5));}
      for(let k=0;k<9;k++)deco.push({t:r?'root':'rock',x:x0+k*34+R()*12,s:8+R()*10});}
    else if(f=='steep'){curve(80,20,t=>t*t);slope(260,0.55);curve(100,30,t=>Math.sin(t*Math.PI/2));}
    else if(f=='roll'){const y0=y;for(let k=0;k<400/STEP;k++){y=y0+k*STEP*Gd*0.8;push(y-Math.sin(k*STEP/100*Math.PI)**2*28*Math.max(0.6,S));}}
    else if(f=='berm'||f=='wall'){deco.push({t:f,x:X(),len:240});curve(240,30,t=>t);}
  });
  slope(300,0.1);FINISH=X();deco.push({t:'finish',x:FINISH});slope(900,0.02);
  ground=pts;
  for(let x=-400;x<FINISH+800;x+=60+R()*90)deco.push({t:'tree',x,s:0.7+R()*0.6,o:R()*30});
}
build(TR);
function gy(x){const i=x/STEP;const a=Math.max(0,Math.min(ground.length-2,Math.floor(i)));const f=Math.min(1,Math.max(0,i-a));return ground[a]*(1-f)+ground[a+1]*f;}
function gs(x){return Math.atan2(gy(x+4)-gy(x-4),8);}

const SFX={ctx:null,master:null,muted:false,wind:null,windG:null,next:0,step:0};
try{SFX.muted=lsGet('wsi_mute')=='1'}catch(e){}
function audioUnlock(){try{
  if(!SFX.ctx){const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;const c=new AC();SFX.ctx=c;
    SFX.master=c.createGain();SFX.master.gain.value=SFX.muted?0:0.5;SFX.master.connect(c.destination);
    const n=c.createBuffer(1,c.sampleRate*2,c.sampleRate),d=n.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;SFX.noise=n;
    const src=c.createBufferSource();src.buffer=n;src.loop=true;const f=c.createBiquadFilter();f.type='bandpass';f.frequency.value=500;f.Q.value=0.7;
    SFX.windG=c.createGain();SFX.windG.gain.value=0;SFX.windF=f;src.connect(f);f.connect(SFX.windG);SFX.windG.connect(SFX.master);src.start();
    SFX.next=c.currentTime+0.1;}
  if(SFX.ctx.state!='running')SFX.ctx.resume();
}catch(e){}}
function tone(type,f0,f1,dur,vol,when){const c=SFX.ctx;if(!c)return;try{const t=when||c.currentTime;const o=c.createOscillator(),g=c.createGain();o.type=type;
  o.frequency.setValueAtTime(f0,t);if(f1)o.frequency.exponentialRampToValueAtTime(f1,t+dur);g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g);g.connect(SFX.master);o.start(t);o.stop(t+dur+0.02);}catch(e){}}
function noise(dur,vol,freq,when){const c=SFX.ctx;if(!c)return;try{const t=when||c.currentTime;const s=c.createBufferSource();s.buffer=SFX.noise;const f=c.createBiquadFilter();f.type='lowpass';f.frequency.value=freq;
  const g=c.createGain();g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);s.connect(f);f.connect(g);g.connect(SFX.master);s.start(t,Math.random());s.stop(t+dur);}catch(e){}}

function music(){const c=SFX.ctx;if(!c||c.state!='running')return;const sp=60/150/4;
  if(SFX.next<c.currentTime)SFX.next=c.currentTime+0.05;
  while(SFX.next<c.currentTime+0.2){const s=SFX.step,t=SFX.next;const bar=Math.floor(s/16)%4;
    if(s%2==0)tone('sawtooth',mf(BASS[(bar*4+Math.floor((s%16)/4))%16]),0,sp*1.8,0.09,t);
    const chill=state=='lift'||state=='select'||state=='title';
    if(chill){if(s%2==0)tone('triangle',mf([64,67,71,74,72,71,67,64][(s/2)%8|0]),0,sp*3,0.05,t);if(s%64==0)tone('sine',90,60,0.4,0.3,t);SFX.next+=sp;SFX.step++;continue;}
    if(s%8==0)tone('sine',150,40,0.15,0.5,t);
    if(s%8==4)noise(0.12,0.25,4000,t);
    if(s%2==1)noise(0.03,0.07,9000,t);

    SFX.next+=sp;SFX.step++;}}

let state='title',p,time=0,score=0,crashes=0,msg='',msgT=0,crashT=0,cp=0,best=0,introT=0,liftT=0,liftLeg=null,sel=4,newBest=false;
function getBest(tr){return +lsGet('wsi_best_'+tr.id)||0;}
function reset(at){p={x:at+40,y:gy(at+40),vx:120,vy:0,a:gs(at+40),av:0,gr:true,rot:0,air:0,wheel:0,pump:0};}
function startLift(lifts,then){state='lift';liftT=0;liftLeg={lifts,then,dur:4.5*lifts.length};}
function startRun(tr){build(tr||TR);state='play';time=0;score=0;crashes=0;cp=0;reset(0);best=getBest(TR);newBest=false;introT=2.6;msg='';msgT=0;camX=p.x-W*0.35;camY=p.y-H*0.55;}
function pickTrail(i){sel=i;const tr=TRAILS[i];const extra=tr.lifts.slice(1);if(extra.length)startLift(extra,()=>startRun(tr));else startRun(tr);}
function startPress(){if(state=='title')startLift(['Fitzsimmons Express'],()=>{state='select';});

function canvasTap(cx,cy){const x=cx*(window.devicePixelRatio||1)/scale,y=cy*(window.devicePixelRatio||1)/scale;
  if(state=='select'){const L=selLayout();for(let i=0;i<TRAILS.length;i++){const r=L[i];if(x>=r.x&&x<=r.x+r.w&&y>=r.y&&y<=r.y+r.h){pickTrail(i);return;}}return;}
  if(state=='done'){const B=doneButtons();if(y>=B.y&&y<=B.y+B.h){if(x>=B.x1&&x<=B.x1+B.w){startLift(['Fitzsimmons Express'],()=>{state='select';});return;}if(x>=B.x2&&x<=B.x2+B.w){startRun(TR);return;}}return;}
  if(state!='play'&&state!='crash')startPress();}
reset(0);
const G=1400;
function norm(a){while(a>Math.PI)a-=2*Math.PI;while(a<-Math.PI)a+=2*Math.PI;return a;}
function crash(){crashes++;sfx.crash();state='crash';crashT=1.4;msg=RIDER+' bailed! Back to the checkpoint...';msgT=1.4;}
function update(dt){
  if(introT>0)introT-=dt;
  if(state=='lift'){liftT+=dt;if(liftT>=liftLeg.dur){const f=liftLeg.then;f();}return;}
  if(state=='crash'){crashT-=dt;p.vy+=G*dt;p.x+=p.vx*dt*0.3;p.y=Math.min(p.y+p.vy*dt,gy(p.x));p.a+=6*dt;
    if(crashT<=0){state='play';reset(checkpoints[cp]);}return;}
  if(state!='play')return;
  time+=dt;
  for(let i=checkpoints.length-1;i>cp;i--)if(p.x>checkpoints[i]){cp=i;msg='Checkpoint!';sfx.ding();msgT=1.2;break;}
  if(p.x>FINISH){state='done';sfx.cheer();const t=time;if(!best||t<best){best=t;newBest=true;lsSet('wsi_best_'+TR.id,t);}return;}
  let s0=null;
  if(p.gr){
    const s=gs(p.x);s0=s;let sp=p.vx*Math.cos(s)+p.vy*Math.sin(s);
    sp+=G*Math.sin(s)*dt*0.9;
    if(keys.right&&sp<650)sp+=380*dt;
    if(keys.left)sp-=Math.sign(sp)*Math.min(Math.abs(sp),700*dt);
    sp-=sp*0.12*dt; if(sp<20&&!keys.left)sp=Math.max(sp,20);
    p.vx=sp*Math.cos(s);p.vy=sp*Math.sin(s);
    if(keys.jump&&p.pump<=0){p.vy-=380;p.pump=0.4;sfx.jump();}
    p.a=s;p.av=0;
  }else{
    p.vy+=G*dt;
    if(!keys.right)p.hr=false;if(!keys.left)p.hl=false;
    const tgt=(keys.right&&!p.hr?1:0)-(keys.left&&!p.hl?1:0);p.av+=(tgt*9-p.av)*Math.min(1,dt*6);
    if(!tgt)p.a+=norm(Math.atan2(p.vy,p.vx)-p.a)*Math.min(1,dt*3);
    p.a+=p.av*dt;p.rot+=p.av*dt;p.air+=dt;
  }
  p.pump-=dt;
  p.x+=p.vx*dt;p.y+=p.vy*dt;p.wheel+=p.vx*dt/13;
  const g=gy(p.x);
  if(p.gr&&s0!==null&&gs(p.x)-s0>0.15&&Math.hypot(p.vx,p.vy)>150){p.gr=false;p.air=0;p.rot=0;if(Math.hypot(p.vx,p.vy)>300)sfx.jump();p.hr=keys.right;p.hl=keys.left;}
  else if(p.y>=g){
    if(!p.gr){const s=gs(p.x);const d=Math.abs(norm(p.a-s));
      if(d>1.05&&p.air>0.25){crash();return;}
      const flips=Math.floor(Math.abs(p.rot)/(2*Math.PI)+0.25);
      let pts=Math.round(p.air*100);if(p.air>0.5)pts+=Math.round(p.air*150);
      if(p.air>0.2)sfx.land(Math.min(1,p.air));if(flips>0){sfx.flip();pts+=flips*1000;msg=(p.rot<0?'BACKFLIP':'FRONTFLIP')+(flips>1?' x'+flips:'')+'! +'+pts;msgT=1.6;}
      else if(p.air>0.6){msg=(d<0.2?'Buttery landing! ':'Big air! ')+'+'+pts;msgT=1.2;}
      if(d<0.2)pts+=50;score+=pts;
      const sp=p.vx*Math.cos(s)+p.vy*Math.sin(s);p.vx=sp*Math.cos(s);p.vy=sp*Math.sin(s);}
    p.y=g;p.gr=true;p.rot=0;p.air=0;
  }else if(p.gr&&g-p.y>3){p.gr=false;p.hr=keys.right;p.hl=keys.left;}
  else if(p.gr)p.y=g;
  if(p.gr&&p.y-gy(p.x)<0)p.y=gy(p.x);
  if(msgT>0)msgT-=dt;
}

  if(msgT>0){ctx.textAlign='center';ctx.font='bold 24px Arial';ctx.lineWidth=4;ctx.strokeStyle='#000';ctx.strokeText(msg,W/2,120);ctx.fillStyle='#ffd23f';ctx.fillText(msg,W/2,120);ctx.textAlign='left';}}
function panel(lines){ctx.fillStyle='rgba(10,20,35,.82)';ctx.fillRect(W/2-300,70,600,400);ctx.textAlign='center';
  lines.forEach(([t,f,c],i)=>{ctx.font=f;ctx.fillStyle=c||'#fff';ctx.fillText(t,W/2,lines.slice(0,i+1).reduce((s,l)=>s+(l[3]||28),90));});ctx.textAlign='left';}
function selCols(){return W>=900?4:2;}
function selLayout(){const c=selCols(),rows=Math.ceil(TRAILS.length/c);const top=110,gap=12;const w=Math.min(200,(W-40-gap*(c-1))/c),h=Math.min(150,(H-top-20-gap*(rows-1))/rows);
  const x0=(W-(c*w+(c-1)*gap))/2;return TRAILS.map((tr,i)=>({x:x0+(i%c)*(w+gap),y:top+Math.floor(i/c)*(h+gap),w,h}));}
function drawSelect(){background();ctx.fillStyle='rgba(10,20,35,.55)';ctx.fillRect(0,0,W,H);ctx.textAlign='center';ctx.fillStyle='#ffd23f';ctx.font='bold 30px Arial';
  ctx.fillText('TOP OF FITZSIMMONS - PICK YOUR TRAIL',W/2,45);ctx.fillStyle='#fff';ctx.font='15px Arial';ctx.fillText('Tap a trailhead sign (or arrows + Enter). '+TRAILS[sel].name+': '+TRAILS[sel].desc,W/2,72);
  ctx.font='12px Arial';ctx.fillStyle='#cde';ctx.fillText('1019 m - Whistler Mountain Bike Park',W/2,92);
  selLayout().forEach((r,i)=>signCard(r.x,r.y,r.w,r.h,TRAILS[i],i==sel));ctx.textAlign='left';}
function drawLift(){const lg=liftLeg,i=Math.min(lg.lifts.length-1,Math.floor(liftT/4.5)),name=lg.lifts[i],k=liftT*90;const ang=-0.28;
  const sky=ctx.createLinearGradient(0,0,0,H);sky.addColorStop(0,'#4f9ae0');sky.addColorStop(1,'#d5ecf8');ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#fff8d0';ctx.beginPath();ctx.arc(W-110,70,28,0,7);ctx.fill();
  const sc=camX;camX=k*3;mtn(1,'#8aa0bf',170,300,0.004,0.05);mtn(3,'#5d7a6a',120,380,0.007,0.15);camX=sc;
  const cx=W*0.5,cy=H*0.38;ctx.save();ctx.translate(cx,cy);ctx.rotate(ang);
  // ground under lift
  ctx.fillStyle='#3f6e45';ctx.fillRect(-W*2,190,W*4,H*2);
  for(let j=-14;j<16;j++){const gx=j*70-((k*2)%70);pine(gx,195+((j*31+Math.floor(k*2/70)*31)%3)*4,1.1,'#1f4a33');}
  for(let j=-3;j<4;j++){const tx=j*500-((k*2)%500);ctx.fillStyle='#666';ctx.fillRect(tx-5,-60,10,260);ctx.fillRect(tx-30,-62,60,6);}
  ctx.strokeStyle='#222';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(-W*2,-58);ctx.lineTo(W*2,-58);ctx.stroke();
  ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(-W*2,-48);ctx.lineTo(W*2,-48);ctx.stroke();
  for(let j=-4;j<5;j++)if(j){const ox=j*260-((k*2)%260);ctx.strokeStyle='#333';ctx.beginPath();ctx.moveTo(ox,-48);ctx.lineTo(ox,-10);ctx.stroke();ctx.fillStyle='#c33';ctx.fillRect(ox-14,-10,28,6);}
  ctx.restore();
  // our chair (kept level)
  ctx.save();ctx.translate(cx,cy+Math.sin(liftT*2)*2);ctx.strokeStyle='#333';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(0,-62);ctx.lineTo(0,10);ctx.stroke();
  ctx.fillStyle='#c33';ctx.fillRect(-40,10,80,8);ctx.fillRect(-40,-18,8,30);ctx.strokeStyle='#888';ctx.beginPath();ctx.moveTo(-40,-6);ctx.lineTo(40,-6);ctx.stroke();
  // bike on carrier
  ctx.save();ctx.translate(58,12);ctx.rotate(1.35);ctx.strokeStyle='#111';ctx.lineWidth=3;ctx.beginPath();ctx.arc(-22,0,12,0,7);ctx.stroke();ctx.beginPath();ctx.arc(22,0,12,0,7);ctx.stroke();
  ctx.strokeStyle='#e0442a';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(-22,0);ctx.lineTo(-4,-1);ctx.lineTo(12,-20);ctx.lineTo(22,0);ctx.moveTo(-4,-1);ctx.lineTo(-8,-18);ctx.lineTo(12,-20);ctx.stroke();ctx.restore();
  ctx.strokeStyle='#555';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(40,10);ctx.lineTo(52,0);ctx.stroke();
  // Sarah sitting
  ctx.strokeStyle='#555';ctx.lineWidth=6;ctx.beginPath();ctx.moveTo(-8,8);ctx.lineTo(14,8);ctx.lineTo(16,34+Math.sin(liftT*3)*3);ctx.stroke();
  ctx.strokeStyle='#1d2a44';ctx.lineWidth=12;ctx.beginPath();ctx.moveTo(-8,8);ctx.lineTo(-8,-20);ctx.stroke();
  ctx.strokeStyle='#6b4423';ctx.lineWidth=6;ctx.beginPath();ctx.moveTo(-20,-36);ctx.quadraticCurveTo(-32,-30,-34,-18+Math.sin(liftT*4)*2);ctx.stroke();
  ctx.fillStyle='#b9c0c8';ctx.beginPath();ctx.ellipse(-6,-46,23,30,0,0,7);ctx.fill();if(head.complete&&head.naturalWidth)ctx.drawImage(head,-28,-75,44,58);
  ctx.restore();
  // banner
  ctx.fillStyle='rgba(10,20,35,.75)';ctx.fillRect(W/2-230,H-110,460,90);ctx.textAlign='center';ctx.fillStyle='#ffd23f';ctx.font='bold 26px Arial';ctx.fillText(name.toUpperCase(),W/2,H-76);
  const base=[675,1019,1850][Math.min(2,i+(lg.lifts[0]=='Fitzsimmons Express'?0:1))]||675,top={'Fitzsimmons Express':1019,'Garbanzo Express':1850,'Peak Express':2182}[name]||1019;
  const fr=Math.min(1,(liftT-i*4.5)/4.5);ctx.fillStyle='#fff';ctx.font='16px Arial';ctx.fillText(RIDER+' heading up - '+Math.round(base+(top-base)*fr)+' m',W/2,H-52);
  ctx.fillStyle='#cde';ctx.font='13px Arial';ctx.fillText('Tap / Space to skip',W/2,H-30);ctx.textAlign='left';}
function doneButtons(){const w=230,h=46;return{w,h,y:385,x1:W/2-w-10,x2:W/2+10};}
function introSign(){if(introT<=0||state=='done')return;ctx.save();ctx.globalAlpha=Math.min(1,introT);const w=240,h=180;signCard(W/2-w/2,95,w,h,TR,false);
  ctx.fillStyle='#fff';ctx.textAlign='center';ctx.font='bold 18px Arial';ctx.lineWidth=4;ctx.strokeStyle='#000';const s=TR.desc;ctx.strokeText(s,W/2,300);ctx.fillText(s,W/2,300);ctx.restore();ctx.textAlign='left';}
function overlay(){
  introSign();
  if(state=='title'){panel([['WHISTLER SEND IT','bold 46px Arial','#ffd23f',50],['starring '+RIDER,'bold 22px Arial','#fff',36],
    ['Ride the lift, pick a real Whistler Bike Park trail, send it','16px Arial','#ddd',40],
    ['→ / ↑ / W : pedal      ← / ↓ / S : brake','16px Arial','#fff',34],['SPACE : pump / jump','16px Arial','#fff',26],
    ['In the air: ← → rotate (flips = bonus!)','16px Arial','#fff',26],['Land with wheels matching the slope or you crash','16px Arial','#fff',26],
    ['Press SPACE / ENTER or tap to ride the Fitzsimmons Express','bold 18px Arial','#7fe07f',50]]);
    if(head.complete&&head.naturalWidth)ctx.drawImage(head,W/2-290,330,90,120),ctx.drawImage(head,W/2+200,330,90,120);}
  if(state=='done'){panel([[TR.name.toUpperCase()+' - FINISH!','bold 36px Arial','#ffd23f',55],[RIDER+' sent it!','bold 22px Arial','#fff',40],
    ['Time: '+time.toFixed(2)+'s   ('+(newBest?'NEW BEST!':'best '+best.toFixed(2)+'s')+')','20px Arial','#fff',44],['Trick score: '+score,'20px Arial','#fff',32],
    ['Crashes: '+crashes+(crashes?'  - living up to "Broke Back"':'  - clean run!'),'20px Arial','#fff',32]]);
    const B=doneButtons();[[B.x1,'Ride the lift again (L)','#2a9d3a'],[B.x2,'Restart trail (R / Enter)','#1f5fbf']].forEach(([x,s,c])=>{ctx.fillStyle=c;ctx.fillRect(x,B.y,B.w,B.h);ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.strokeRect(x,B.y,B.w,B.h);ctx.fillStyle='#fff';ctx.font='bold 16px Arial';ctx.textAlign='center';ctx.fillText(s,x+B.w/2,B.y+29);ctx.textAlign='left';});}
}
let last=performance.now();
function frame(now){const dt=Math.min(0.033,(now-last)/1000);last=now;
  for(let i=0;i<2;i++)update(dt/2);
  try{music();if(SFX.windG){const v=state=='play'?Math.hypot(p.vx,p.vy):0;SFX.windG.gain.value=Math.min(0.25,v/2800)*(p.gr?1:1.4);SFX.windF.frequency.value=300+v*1.5;}}catch(e){}
  camX+=(p.x-W*0.35-camX)*0.15;camY+=(p.y-H*0.55-camY)*0.1;
  ctx.setTransform(scale,0,0,scale,0,0);if(state=='lift')drawLift();else if(state=='select')drawSelect();else{background();world();if(state!='title')hud();overlay();}
  requestAnimationFrame(frame);}
camX=p.x-W*0.35;camY=p.y-H*0.55;
requestAnimationFrame(frame);
window.__game={TRAILS,pickTrail,startPress,get TR(){return TR},get FINISH(){return FINISH},get state(){return state},get p(){return p},get crashes(){return crashes},get score(){return score}};
